[tool.poetry]
name = "workout-suggest"
version = "0.1.0"
description = ""
authors = ["Gabriel Augendre <gabriel@augendre.info>"]

[tool.poetry.dependencies]
python = "^3.9"
Django = "^3.1.3"

[tool.poetry.dev-dependencies]
pytest = "^6.1"
pre-commit = "^2.8.2"
pytest-django = "^4.1.0"
pytest-cov = "^2.10.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
junit_family = "xunit1"
testpaths = [
    "src",
]
python_files = [
    "test_*.py",
    "tests.py",
]

[tool.black]
target-version = ['py38']

[tool.isort]
profile = "black"
